name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skill repository
        run: python3 scripts/validate_skill_repo.py
      - name: Installer smoke test
        run: |
          python3 scripts/install_skill.py --list
          python3 scripts/install_skill.py --agent all --home /tmp/loop-paper-home --dry-run
          python3 scripts/install_skill.py --agent codex --dest /tmp/loop-paper-install/loop-paper
          test -f /tmp/loop-paper-install/loop-paper/SKILL.md
          python3 /tmp/loop-paper-install/loop-paper/scripts/validate_skill_repo.py
          python3 /tmp/loop-paper-install/loop-paper/scripts/smoke_test.py
          python3 /tmp/loop-paper-install/loop-paper/scripts/edge_case_test.py
      - name: Smoke initialize and pipeline
        run: python3 scripts/smoke_test.py
      - name: Edge-case rejection tests
        run: python3 scripts/edge_case_test.py
